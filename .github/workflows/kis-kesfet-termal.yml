name: Aylık kamu termal taraması

on:
  schedule:
    - cron: "0 3 3 * *"   # her ayın 3'ü 03:00 UTC = 06:00 Türkiye
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY RUN (JSON'a yazmaz)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: kis-kesfet-write
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kis_kesfet/requirements.txt

      - name: Bağımlılıklar
        run: pip install -r kis_kesfet/requirements.txt

      - name: Testler
        run: python -m pytest kis_kesfet/tests -q

      - name: Termal taraması
        run: python kis_kesfet/scan.py --kategori termal

      - name: JSON sözdizimi
        run: python -c "import json; json.load(open('kis_kesfet/data/kis_kesfet.json', encoding='utf-8'))"

      - name: Rapor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kis-kesfet-termal-${{ github.run_number }}
          path: kis_kesfet/reports/
          if-no-files-found: ignore

      - name: Commit ve push
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "rotalink-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kis_kesfet/data/termal.json kis_kesfet/data/kis_kesfet.json kis_kesfet/reports/
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atılmadı."
            exit 0
          fi
          git commit -m "chore: monthly public thermal catalog update"
          git pull --rebase origin main
          git push origin HEAD:main
