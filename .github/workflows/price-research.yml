name: Aylık resmî fiyat kontrolü

on:
  schedule:
    - cron: "0 1 1 * *"   # her ayın 1'i 01:00 UTC = 04:00 Türkiye
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY RUN (fiyatlar.json'a yazmaz)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: price-research
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: price_research/requirements.txt

      - name: Bağımlılıklar
        run: pip install -r price_research/requirements.txt

      - name: Testler
        run: python -m pytest price_research/tests -q

      - name: Mevcut veri doğrulama (baseline)
        run: python price_research/validate.py --write-baseline "$RUNNER_TEMP/baseline.json"

      - name: Resmî kaynak kontrolü
        run: python price_research/monitor.py

      - name: Yeni hata kontrolü + JSON sözdizimi
        run: |
          python price_research/validate.py --baseline "$RUNNER_TEMP/baseline.json"
          python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ('fiyatlar.json','price_research/sources.json')]"

      - name: Rapor artefaktı
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiyat-raporu-${{ github.run_number }}
          path: price_research/reports/
          if-no-files-found: ignore

      - name: Commit ve push (yalnızca canlı modda ve değişiklik varsa)
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "rotalink-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fiyatlar.json price_research/sources.json price_research/reports/
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atılmadı."
            exit 0
          fi
          git commit -m "chore: monthly public facility price update"
          git pull --rebase origin main
          git push origin HEAD:main
