name: Kamp alanları keşfi (6 ayda bir)

on:
  schedule:
    - cron: "0 2 1 1,7 *"   # 1 Ocak ve 1 Temmuz 02:00 UTC = 05:00 Türkiye
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY RUN (dosyaya yazmaz)"
        type: boolean
        default: true
      only_il:
        description: "Yalnız bu iller (virgülle; boş = 81 il)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: rotalink-camp-write
  cancel-in-progress: false

jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CAMP_MODE: discover
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      CAMP_ONLY_IL: ${{ github.event_name == 'workflow_dispatch' && inputs.only_il || '' }}
      CAMP_TIME_BUDGET_MIN: "90"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test aracı
        run: pip install pytest

      - name: Testler
        run: python -m pytest kamp/tests -q

      - name: Yeni kamp alanlarını keşfet
        run: python kamp/discover.py

      - name: JSON sözdizimi
        run: python -c "import json,pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('data').glob('camp_*.json')]"

      - name: Rapor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kamp-kesif-${{ github.run_number }}
          path: kamp/reports/
          if-no-files-found: ignore

      - name: Commit ve push
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "rotalink-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data/camp_sites.json data/camp_sources.json data/camp_price_history.json data/camp_review_queue.json; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atılmadı."
            exit 0
          fi
          git commit -m "chore: camp site discovery (6 ayda bir)"
          git pull --rebase origin main
          git push origin HEAD:main
