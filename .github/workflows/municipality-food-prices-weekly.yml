name: Belediye tesisleri yemek fiyatları (haftalık kaynak kontrolü)

# Yalnız daha önce fiyat bulunan resmî kaynakları yeniden indirir; SHA256 aynıysa
# yeniden ayrıştırmaz, değiştiyse fiyatları günceller, kaynak kaybolduysa
# fiyatları silmeden "kaynak_bulunamadi" olarak işaretler.
on:
  schedule:
    - cron: "0 5 * * 1"   # her pazartesi 05:00 UTC = 08:00 Türkiye
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY RUN (hiçbir dosyaya yazmaz)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: rotalink-data-write
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MENU_MODE: known
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      MENU_TIME_BUDGET_MIN: "45"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: price_research/requirements.txt

      - name: Bağımlılıklar
        run: pip install -r price_research/requirements.txt pytest

      - name: Testler
        run: python -m pytest sosyal_menu/tests -q

      - name: Bilinen kaynakları kontrol et
        run: python sosyal_menu/menu.py

      - name: JSON sözdizimi
        run: |
          python -c "import json, pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in [pathlib.Path('sosyal_menuler.json'), *pathlib.Path('sosyal_menu').glob('*.json')]]"

      - name: Rapor artefaktı
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yemek-fiyat-haftalik-${{ github.run_number }}
          path: sosyal_menu/reports/
          if-no-files-found: ignore

      - name: Commit ve push (yalnızca canlı modda ve değişiklik varsa)
        id: commit
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "rotalink-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in sosyal_menuler.json sosyal_menu/kaynaklar.json \
                   sosyal_menu/fiyat_gecmisi.json sosyal_menu/degisiklikler.json sosyal_menu/inceleme.json; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atılmadı."
            exit 0
          fi
          git commit -m "chore: weekly municipal facility food price check"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Rotalink API'ye gönder (secrets tanımlıysa)
        if: steps.commit.outputs.pushed == 'true'
        env:
          ROTALINK_API_URL: ${{ secrets.ROTALINK_API_URL }}
          ROTALINK_API_KEY: ${{ secrets.ROTALINK_API_KEY }}
        run: python sosyal_menu/push_api.py
